<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NARA — OpenWrt connection manager</title>
  <style>
    body{background:#fafcfb;margin:0;font-family:system-ui,sans-serif} main{position:relative;z-index:0;padding:24px 28px 15px} .demo-note{position:static;background:#183f3b;color:#ffffff;padding:9px 24px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.2px} #notifications{position:fixed;bottom:20px;right:20px;max-width:400px;z-index:20} .notice{padding:14px 20px;background:#fff;box-shadow:0 3px 22px #0002;border-radius:10px;margin-top:10px;font-size:13px}.notice.error{border-left:4px solid #b64834}@media(max-width:470px){main{padding:18px 14px}}
  </style>
</head>
<body>
  <div class="demo-note">INTERACTIVE PREVIEW · Sample servers and simulated connections. Install on OpenWrt for a real connection.</div>
  <main id="app"></main><div id="notifications" aria-live="polite"></div>
  <script src="preview.js"></script>
</body>
</html>
